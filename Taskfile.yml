version: "3"

vars:
  PROJECT_NAME: "rss"
  PULUMI_DIR: "../pulumi-iac/rss"

tasks:
  ui:deps:
    desc: Install legacy ui dependencies when the legacy frontend exists
    dir: ui
    deps: [ui:npm-install]
    status:
      - test -f ui/package.json

  ui:npm-install:
    desc: Install legacy ui dependencies with pnpm
    dir: ui
    cmds:
      - pnpm install
    status:
      - test -f ui/package.json

  ui:dev:
    desc: Start the legacy rss frontend when present
    dir: ui
    deps: [ui:deps]
    cmds:
      - pnpm run dev
    status:
      - test -f ui/package.json

  ui-next:deps:
    desc: Install ui-next dependencies
    dir: ui-next
    cmds:
      - pnpm install

  ui-next:dev:
    desc: Start the rss Next frontend
    dir: ui-next
    deps: [ui-next:deps]
    cmds:
      - pnpm run dev

  ui-next:test:
    desc: Typecheck and test the rss Next frontend
    dir: ui-next
    deps: [ui-next:deps]
    cmds:
      - pnpm run typecheck
      - pnpm run test

  ui-next:typecheck:
    desc: Typecheck the rss Next frontend
    dir: ui-next
    deps: [ui-next:deps]
    cmds:
      - pnpm run typecheck

  ui-next:test:watch:
    desc: Run the rss Next frontend tests in watch mode
    dir: ui-next
    deps: [ui-next:deps]
    cmds:
      - pnpm run test:watch

  kaleido:version:
    desc: Print the rss ui-next Kaleido dependency version
    dir: ui-next
    cmds:
      - node -p "require('./package.json').dependencies['@ericbutera/kaleido']"

  kaleido:upgrade:
    desc: Upgrade rss ui-next to @ericbutera/kaleido VERSION=x.y.z
    requires:
      vars: [VERSION]
    dir: ui-next
    cmds:
      - pnpm up @ericbutera/kaleido@{{.VERSION}}
      - pnpm typecheck

  api:dev:
    desc: Start the rss API
    cmds:
      - cargo run --bin api

  api:build:
    desc: Build the rss API
    cmds:
      - cargo build --release --bin api

  worker:dev:
    desc: Start the rss worker
    cmds:
      - cargo run --bin worker

  worker:build:
    desc: Build the rss worker
    cmds:
      - cargo build --release --bin worker

  migration:up:
    desc: Run rss database migrations
    dir: migration
    cmds:
      - cargo run -- up

  test:
    desc: Run rss Rust tests
    cmds:
      - cargo test

  fmt:
    desc: Format the rss Rust workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check rss Rust formatting without writing changes
    cmds:
      - cargo fmt --all --check

  test:worker:
    desc: Run rss worker tests
    cmds:
      - cargo test --test worker

  test:worker:integration:
    desc: Run ignored rss worker integration tests
    cmds:
      - cargo test -p worker -- --ignored

  deploy:prod:
    desc: Run pulumi up for the rss production stack
    dir: '{{.PULUMI_DIR}}'
    cmds:
      - pulumi stack select ericbutera/rss/rss --non-interactive
      - pulumi up --yes --skip-preview

  openapi:react-query:
    desc: Generate OpenAPI TypeScript definitions from running API
    vars:
      OPENAPI_TMP: .openapi-tmp.json
    cmds:
      - echo "Waiting for API to be ready..."
      - |
        OPENAPI_URL="${OPENAPI_URL:-http://localhost:3000/openapi.json}"
        OPENAPI_TMP="{{.OPENAPI_TMP}}"
        for i in {1..30}; do
          status=$(curl -s -o "$OPENAPI_TMP" -w "%{http_code}" "$OPENAPI_URL" || echo "000")
          if [ "$status" = "200" ]; then
            if node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('$OPENAPI_TMP','utf8')); if(!j.openapi) process.exit(2);" >/dev/null 2>&1; then
              break
            fi
          fi
          sleep 2
        done
      - npx openapi-typescript {{.OPENAPI_TMP}} --output ui-next/lib/react-query/api.d.ts
      - rm -f {{.OPENAPI_TMP}}
